<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportPredicts Tenis - Cuadro y Partidos</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center">

<header class="w-full bg-slate-950/95 backdrop-blur-md border-b border-slate-800/80 px-4 lg:px-6 py-2.5 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
        <button onclick="toggleMenuMovil()" class="lg:hidden text-slate-300 hover:text-emerald-400 text-xl p-1.5 rounded-lg bg-slate-900 border border-slate-800">☰</button>
        <div class="flex items-center gap-2.5 cursor-pointer group" onclick="window.location.href='index.html'">
            <div class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center shadow-inner group-hover:border-emerald-500/50 transition">
                <span class="text-lg">🎾</span>
            </div>
            <div class="flex flex-col">
                <span class="font-black tracking-tight text-white text-sm sm:text-base leading-none group-hover:text-emerald-400 transition">Sport<span class="text-emerald-400">Predicts</span></span>
                <span class="text-[9px] font-bold text-amber-400/90 tracking-wider uppercase mt-0.5 flex items-center gap-0.5">⚡ TENIS MOTOR V5</span>
            </div>
        </div>
    </div>

    <nav class="hidden lg:flex items-center gap-1 xl:gap-2 text-xs font-semibold text-slate-300">
        <a href="index.html" class="nav-item px-3 py-2 rounded-xl hover:bg-slate-900 hover:text-emerald-400 transition">Inicio</a>
        <a href="competiciones.html" class="nav-item px-3 py-2 rounded-xl hover:bg-slate-900 hover:text-emerald-400 transition">🏆 Torneos ATP/WTA</a>
        <a href="partidos-hora.html" class="nav-item px-3 py-2 rounded-xl bg-slate-900 text-emerald-400 font-bold transition border border-emerald-500/30">⏰ Partidos por Hora</a>
        <a href="partidos.html?liga=VIE&historial=true" class="nav-item px-3 py-2 rounded-xl hover:bg-slate-900 hover:text-emerald-400 transition">📜 Historial</a>
        <a href="calculadora.html" class="nav-item px-3.5 py-1.5 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 font-bold transition mx-1">🧮 Calculadora & EV</a>
        <a href="planes.html" class="nav-item px-3 py-2 rounded-xl hover:bg-slate-900 hover:text-emerald-400 transition text-sky-400">💎 Planes</a>
    </nav>
</header>

<main class="w-full max-w-4xl flex flex-col gap-6 p-3 sm:p-6 my-4">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-800 pb-4">
        <div class="flex items-center gap-3">
            <span id="liga-icono" class="text-2xl">🇦🇹</span>
            <div>
                <h1 id="liga-titulo" class="text-lg sm:text-xl font-black text-white">Erste Bank Open (Viena)</h1>
                <p class="text-[11px] sm:text-xs text-slate-400">Selecciona cualquier torneo del circuito</p>
            </div>
        </div>

        <div id="selector-liga-historial-container" class="flex items-center gap-2">
            <select id="select-liga-historial" onchange="cambiarLigaSelector(this.value)" class="bg-slate-900 border border-slate-700 text-emerald-400 text-xs font-bold rounded-xl px-3 py-2 outline-none focus:border-emerald-500 cursor-pointer">
                <option value="VIE">🇦🇹 Erste Bank Open (Viena)</option>
                <optgroup label="Grand Slams">
                    <option value="AO">🇦🇺 Australian Open</option>
                    <option value="RG">🇫🇷 Roland Garros</option>
                    <option value="WIM">🇬🇧 Wimbledon</option>
                    <option value="USO">🇺🇸 US Open</option>
                </optgroup>
                <optgroup label="Torneo de Maestros">
                    <option value="FIN">👑 ATP / WTA Finals</option>
                </optgroup>
                <optgroup label="ATP 500 & Circuitos">
                    <option value="WTA">✨ WTA Tour</option>
                </optgroup>
            </select>
        </div>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-900/60 border border-slate-800 p-3.5 rounded-2xl">
        <div class="flex items-center gap-2 flex-wrap">
            <select id="select-orden" onchange="cambiarOrden()" class="bg-slate-950 border border-slate-800 text-slate-300 text-xs rounded-xl px-3 py-2 outline-none focus:border-emerald-500 font-semibold cursor-pointer">
                <option value="fecha">📅 Por Hora de Pista</option>
                <option value="probabilidad">⭐ Por Probabilidad de Victoria</option>
            </select>
            <button id="btn-solo-valor" onclick="toggleSoloValor()" aria-pressed="false" class="bg-slate-950 border border-slate-800 hover:border-slate-700 text-slate-300 text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
                <span>💎</span> Top (EV+)
            </button>
        </div>

        <div class="flex items-center gap-2">
            <span class="text-xs text-slate-400 font-semibold">Stake:</span>
            <input type="number" id="input-stake" value="10" min="1" max="10000" oninput="actualizarSimulacion()" class="w-20 bg-slate-950 border border-slate-800 text-white text-xs font-bold rounded-xl px-3 py-2 text-center outline-none focus:border-emerald-500">
            <span class="text-xs text-slate-400 font-bold">€</span>
        </div>
    </div>

    <div id="estado" class="text-xs text-emerald-400 font-semibold px-1">
        🎾 Sincronizando cuadro de Viena...
    </div>

    <div id="partidos-container" class="flex flex-col gap-4">
        <div class="bg-slate-900/50 animate-pulse h-44 rounded-2xl border border-slate-800"></div>
    </div>
</main>

<script src="app.js?v=52"></script>
<script>
function cambiarLigaSelector(codigoLiga) {
    const params = new URLSearchParams(window.location.search);
    const esHist = params.get('historial') === 'true';
    window.location.href = `partidos.html?liga=${codigoLiga}${esHist ? '&historial=true' : ''}`;
}
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const ligaParam = params.get('liga') || 'VIE';
    const selectHistorial = document.getElementById('select-liga-historial');
    if (selectHistorial) selectHistorial.value = ligaParam;
});
</script>
</body>
</html>
