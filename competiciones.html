<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pepobets — Torneos ATP y WTA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- BARRA DE NAVEGACIÓN -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a href="index.html" class="flex items-center gap-2">
          <span class="text-xl font-black text-white tracking-wider">pepo<span class="text-emerald-400">bets</span></span>
        </a>
        <nav class="hidden md:flex items-center gap-1 text-sm font-medium text-slate-300">
          <a href="index.html" class="px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition">Inicio</a>
          <a href="competiciones.html" class="px-3 py-2 rounded-lg bg-slate-800 text-white font-bold">Torneos ATP/WTA</a>
          <a href="partidos-hora.html" class="px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition">Partidos por Hora</a>
          <a href="calculadora.html" class="px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition">Calculadora & EV+</a>
          <a href="planes.html" class="px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition">Planes</a>
        </nav>
      </div>

      <div class="flex items-center gap-3">
        <!-- BOTÓN DE CONTROL MANUAL DE LA API (0 PETICIONES POR DEFECTO) -->
        <button onclick="forzarActualizacionAPI()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 text-xs font-bold px-3 py-2 rounded-xl transition shadow flex items-center gap-1.5" title="Sincronizar manualmente con la API externa">
          🔄 Sincronizar API
        </button>

        <div id="auth-user-container" class="flex items-center gap-3">
          <!-- Renderizado dinámico de Auth por app.js -->
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-8">
    
    <!-- ENCABEZADO DE SECCIÓN -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900/60 border border-slate-800 rounded-3xl p-6 md:p-8">
      <div>
        <div class="flex items-center gap-2 text-emerald-400 text-xs font-bold mb-1">
          <span>🏆 Temporada Oficial de Tenis</span>
        </div>
        <h1 class="text-2xl md:text-3xl font-black text-white" id="liga-titulo">Erste Bank Open (Viena)</h1>
      </div>
      
      <div class="flex flex-wrap items-center gap-3">
        <select id="select-orden" onchange="cambiarOrden()" class="bg-slate-950 border border-slate-800 text-xs text-slate-300 font-bold px-3 py-2.5 rounded-xl outline-none focus:border-emerald-500 transition">
          <option value="fecha">📅 Ordenar por Fecha</option>
          <option value="probabilidad">📊 Ordenar por Probabilidad</option>
        </select>

        <button id="btn-solo-valor" onclick="toggleSoloValor()" class="bg-slate-950 hover:bg-slate-900 border border-slate-800 text-slate-300 text-xs font-bold px-4 py-2.5 rounded-xl transition shadow">
          💎 Solo Oportunidades EV+
        </button>

        <button onclick="toggleVistaHistorial()" class="bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl transition shadow">
          📜 Ver Historial
        </button>
      </div>
    </div>

    <!-- ESTADO Y FILTROS RÁPIDOS DE TORNEOS -->
    <div class="flex flex-col gap-4">
      <div class="flex justify-between items-center text-xs text-slate-400 px-1">
        <span id="estado">Cargando torneos y partidos...</span>
        <span class="text-[10px] bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg">Modo Local Seguro (0 Peticiones)</span>
      </div>

      <!-- Selector Rápido de Torneos Destacados -->
      <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-2">
        <button onclick="cambiarLiga('VIE')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-left p-3 rounded-xl transition">
          <div class="text-sm">🇦🇹 Viena</div>
          <div class="text-[10px] text-emerald-400 font-bold">ATP 500</div>
        </button>
        <button onclick="cambiarLiga('AO')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-left p-3 rounded-xl transition">
          <div class="text-sm">🇦🇺 Aus. Open</div>
          <div class="text-[10px] text-slate-400">Grand Slam</div>
        </button>
        <button onclick="cambiarLiga('RG')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-left p-3 rounded-xl transition">
          <div class="text-sm">🇫🇷 R. Garros</div>
          <div class="text-[10px] text-slate-400">Grand Slam</div>
        </button>
        <button onclick="cambiarLiga('WIM')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-left p-3 rounded-xl transition">
          <div class="text-sm">🇬🇧 Wimbledon</div>
          <div class="text-[10px] text-slate-400">Grand Slam</div>
        </button>
        <button onclick="cambiarLiga('USO')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-left p-3 rounded-xl transition">
          <div class="text-sm">🇺🇸 US Open</div>
          <div class="text-[10px] text-slate-400">Grand Slam</div>
        </button>
        <button onclick="cambiarLiga('FIN')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-left p-3 rounded-xl transition">
          <div class="text-sm">👑 ATP Finals</div>
          <div class="text-[10px] text-slate-400">Torneo Maestros</div>
        </button>
      </div>
    </div>

    <!-- CONTENEDOR DE PARTIDOS -->
    <div id="partidos-container" class="space-y-4">
      <!-- Los partidos se inyectan dinámicamente desde app.js -->
    </div>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="border-t border-slate-800 bg-slate-900/40 py-6 mt-12 text-center text-xs text-slate-500">
    <p>© 2026 pepobets. Plataforma profesional de análisis de tenis y modelos de valor esperado (EV+).</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
